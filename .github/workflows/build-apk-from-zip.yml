name: Build Android APK from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'MobileRepairAcademyPro_GitHub_APK.zip'
      - '.github/workflows/build-apk-from-zip.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          test -f MobileRepairAcademyPro_GitHub_APK.zip
          unzip -q MobileRepairAcademyPro_GitHub_APK.zip -d extracted
          test -f extracted/MobileRepairAcademyPro/settings.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: extracted/MobileRepairAcademyPro
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MobileRepairAcademyPro-debug-apk
          path: extracted/MobileRepairAcademyPro/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
